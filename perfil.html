<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perfil · Carros Escala Perú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0D0D0E;--card:#18181B;--glass:rgba(24,24,27,.75);--line:#27272A;--hi:rgba(255,255,255,.12);
  --red:#E10600;--tx:#fff;--tx2:#A1A1AA;
  --fh:'Chakra Petch',system-ui,-apple-system,sans-serif;--fb:'Inter',system-ui,-apple-system,sans-serif;
  --r-sm:8px;--r-md:18px;--r-pill:9999px;
  --spring:cubic-bezier(.16,1,.3,1);--t-smooth:300ms var(--spring);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--fb);-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit;text-decoration:none}
h1,h2{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 1.5rem}
.nav{position:sticky;top:0;z-index:50;height:52px;background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem}
.logo{display:flex;align-items:center}
.logo img{display:block;height:40px;width:auto}
.back{font-size:.875rem;color:var(--tx2);transition:color var(--t-smooth)}
.back:hover{color:var(--tx)}
.btn-2{display:inline-flex;align-items:center;justify-content:center;font-family:var(--fb);font-weight:600;font-size:.875rem;background:transparent;color:var(--tx);border:1px solid var(--line);border-radius:var(--r-pill);padding:.65rem 1.6rem;cursor:pointer;transition:background var(--t-smooth),border-color var(--t-smooth)}
.btn-2:hover{background:rgba(255,255,255,.06);border-color:var(--hi)}
a:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:3px}
.eyebrow{font-family:var(--fh);font-weight:600;font-style:italic;text-transform:uppercase;color:var(--red);font-size:.8125rem;letter-spacing:.08em;margin-bottom:.5rem}
.tiny{font-size:.8125rem;color:var(--tx2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md)}
main{padding:2.5rem 0 4rem}
.prof{display:grid;grid-template-columns:280px 1fr;gap:1.5rem;align-items:start}
.side{padding:2rem;position:sticky;top:76px}
.av{width:72px;height:72px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:700;font-style:italic;font-size:1.6rem;margin-bottom:1rem}
.nick{font-family:var(--fh);font-weight:700;font-style:italic;font-size:1.4rem;word-break:break-word}
.num{font-family:var(--fh);font-weight:700;font-style:italic;font-size:2.25rem;line-height:1;margin-top:1.25rem}
.gal{display:grid;grid-template-columns:1fr;gap:1.25rem}
.pic{overflow:hidden;transition:transform var(--t-smooth),border-color var(--t-smooth);display:grid;grid-template-columns:minmax(220px,340px) 1fr}
.pic:hover{transform:translateY(-4px);border-color:var(--hi)}
.ph{background:repeating-linear-gradient(45deg,#1c1c1f 0 12px,#1a1a1d 12px 24px);width:100%;aspect-ratio:1/1;position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cap{padding:1.75rem 2rem;align-self:center}
.desc{color:var(--tx2);font-size:.9375rem;line-height:1.65;margin:.9rem 0 0;max-width:62ch}
.cap b{display:block;font-family:var(--fh);font-weight:700;font-style:italic;text-transform:uppercase;font-size:1.35rem;line-height:1.15;margin-bottom:.25rem}
.msg{color:var(--tx2);padding:3rem 0}
footer{border-top:1px solid var(--line);padding:2.5rem 0 3rem;color:var(--tx2);font-size:.875rem}
@media(max-width:900px){.prof{grid-template-columns:1fr}.side{position:static}.pic{grid-template-columns:1fr}.cap{padding:1.25rem 1.25rem 1.4rem}.cap b{font-size:1.15rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<nav class="nav" aria-label="Principal">
  <a class="logo" href="index.html"><img src="logo.png" alt="Carros Escala Perú"></a>
  <a class="back" href="index.html#galeria">← Galería</a>
</nav>

<main>
  <div class="wrap">
    <p class="msg" id="carga">Cargando perfil…</p>

    <div class="prof" id="perfil" hidden>
      <aside class="card side">
        <div class="eyebrow">Coleccionista</div>
        <div class="av" id="av"></div>
        <div class="nick" id="nick"></div>
        <div class="tiny" id="since" style="margin:.25rem 0 0"></div>
        <div class="num" id="cant">0</div>
        <div class="tiny" style="margin-bottom:1.5rem">modelos publicados</div>
        <button class="btn-2" type="button" id="share">Compartir perfil</button>
      </aside>
      <section>
        <div class="gal" id="gal"></div>
        <p class="msg" id="vacio" hidden>Aún no tiene fotos publicadas.</p>
      </section>
    </div>

    <p class="msg" id="nf" hidden>Coleccionista no encontrado. <a href="index.html#galeria" style="color:#fff;text-decoration:underline">Volver a la galería</a></p>
  </div>
</main>

<footer>
  <div class="wrap">No es para cualquiera. Es para el que sabe.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
var n=(new URLSearchParams(location.search).get('u')||'').trim().toLowerCase();

async function init(){
  try{
    if(!n){throw 'sin-apodo'}
    var p=await SB.from('perfiles').select('user_id,apodo').eq('apodo',n).maybeSingle();
    if(p.error)throw p.error;
    if(!p.data){throw 'sin-perfil'}
    var f=await SB.from('fotos').select('modelo,marca,escala,descripcion,ruta,creada').eq('user_id',p.data.user_id).eq('estado','aprobada').order('creada',{ascending:false});
    if(f.error)throw f.error;
    var d=f.data||[];

    document.title='@'+p.data.apodo+' · Carros Escala Perú';
    $('av').textContent=p.data.apodo.charAt(0).toUpperCase();
    $('nick').textContent='@'+p.data.apodo;
    $('cant').textContent=d.length;
    if(d.length){
      $('since').textContent='En la comunidad desde '+new Date(d[d.length-1].creada).toLocaleDateString('es-PE',{month:'long',year:'numeric'});
    }
    $('gal').innerHTML=d.map(function(x){
      var sub=[x.marca,x.escala].filter(Boolean).join(' · ');
      var url=FOTO_URL(x.ruta);
      return '<a class="card pic" href="'+esc(url)+'" target="_blank" rel="noopener">'+
        '<div class="ph"><img src="'+esc(url)+'" alt="'+esc(x.modelo)+'" loading="lazy"></div>'+
        '<div class="cap"><b>'+esc(x.modelo)+'</b><div class="tiny">'+esc(sub)+'</div>'+(x.descripcion?'<p class="desc">'+esc(x.descripcion)+'</p>':'')+'</div></a>';
    }).join('');
    $('vacio').hidden=d.length>0;
    $('carga').hidden=true;$('perfil').hidden=false;

    $('share').addEventListener('click',function(){
      var b=this,u=location.href;
      if(navigator.share){navigator.share({title:'@'+p.data.apodo,url:u}).catch(function(){})}
      else if(navigator.clipboard){navigator.clipboard.writeText(u).then(function(){b.textContent='Enlace copiado';setTimeout(function(){b.textContent='Compartir perfil'},2000)})}
    });
  }catch(err){
    console.error(err);
    $('carga').hidden=true;
    if(err==='sin-apodo'||err==='sin-perfil'){$('nf').hidden=false}
    else{$('carga').hidden=false;$('carga').textContent='No se pudo cargar el perfil. Recarga la página.'}
  }
}
init();
</script>
</body>
</html>
