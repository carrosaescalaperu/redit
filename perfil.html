<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perfil · Carros Escala Perú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0D0D0E;--card:#18181B;--glass:rgba(24,24,27,.75);--line:#27272A;--hi:rgba(255,255,255,.12);
  --red:#E10600;--glow:rgba(225,6,0,.3);--tx:#fff;--tx2:#A1A1AA;
  --fh:'Chakra Petch',system-ui,-apple-system,sans-serif;--fb:'Inter',system-ui,-apple-system,sans-serif;
  --r-sm:8px;--r-md:18px;--r-pill:9999px;
  --spring:cubic-bezier(.16,1,.3,1);--t-fast:150ms var(--spring);--t-smooth:300ms var(--spring);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--fb);-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit;text-decoration:none}
h1,h2{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 1.5rem}
.nav{position:sticky;top:0;z-index:50;height:52px;background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem}
.logo{font-family:var(--fh);font-weight:700;font-style:italic;text-transform:uppercase;font-size:.9rem;letter-spacing:.04em}
.logo span{color:var(--red)}
.back{font-size:.875rem;color:var(--tx2);transition:color var(--t-smooth)}
.back:hover{color:var(--tx)}
.btn-2{display:inline-flex;align-items:center;justify-content:center;font-family:var(--fb);font-weight:600;font-size:.875rem;background:transparent;color:var(--tx);border:1px solid var(--line);border-radius:var(--r-pill);padding:.65rem 1.6rem;cursor:pointer;transition:background var(--t-smooth),border-color var(--t-smooth)}
.btn-2:hover{background:rgba(255,255,255,.06);border-color:var(--hi)}
a:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:3px}
.eyebrow{font-family:var(--fh);font-weight:600;font-style:italic;text-transform:uppercase;color:var(--red);font-size:.8125rem;letter-spacing:.08em;margin-bottom:.5rem}
.tiny{font-size:.8125rem;color:var(--tx2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:2rem}
main{padding:3rem 0 4rem}
.prof{display:grid;grid-template-columns:260px 1fr;gap:2rem}
.av{width:72px;height:72px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:700;font-style:italic;font-size:1.6rem;margin-bottom:1rem}
.nick{font-family:var(--fh);font-weight:700;font-style:italic;font-size:1.3rem}
.ph{background:repeating-linear-gradient(45deg,#1c1c1f 0 12px,#1a1a1d 12px 24px);border-radius:var(--r-sm);width:100%;aspect-ratio:1/1}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}
.list{list-style:none;margin:1.25rem 0 0;padding:0}
.list li{display:flex;justify-content:space-between;gap:1rem;padding:.7rem 0;border-top:1px solid var(--line);font-size:.9rem}
.list li span:last-child{color:var(--tx2)}
footer{border-top:1px solid var(--line);padding:2.5rem 0 3rem;color:var(--tx2);font-size:.875rem}
@media(max-width:900px){.prof{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<nav class="nav" aria-label="Principal">
  <a class="logo" href="index.html">Carros Escala <span>Perú</span></a>
  <a class="back" href="index.html#galeria">← Volver a la galería</a>
</nav>

<main>
  <div class="wrap">
    <div class="eyebrow">Coleccionista</div>
    <div class="card prof" id="perfil">
      <div>
        <div class="av" id="av"></div>
        <div class="nick" id="nick"></div>
        <div class="tiny" id="since" style="margin:.25rem 0 1.25rem"></div>
        <button class="btn-2" type="button" id="share">Compartir perfil</button>
      </div>
      <div>
        <div class="thumbs"><div class="ph"></div><div class="ph"></div><div class="ph"></div></div>
        <ul class="list" id="mods"></ul>
      </div>
    </div>
    <p id="nf" hidden style="color:var(--tx2)">Coleccionista no encontrado. <a href="index.html#galeria" style="color:#fff;text-decoration:underline">Volver a la galería</a></p>
  </div>
</main>

<footer>
  <div class="wrap">No es para cualquiera. Es para el que sabe.</div>
</footer>

<script>
var C={
 rakuda_jdm:{since:'octubre 2026',m:[['Nissan Skyline R34','1:18 · Solido'],['Toyota Supra MK4','1:18 · Solido'],['Mazda RX-7 FD','1:18 · Solido']]},
 f1_lima:{since:'octubre 2026',m:[['Ferrari SF-25','1:18 · F1'],['McLaren MCL39','1:18 · F1'],['Red Bull RB21','1:18 · F1']]},
 garaje_lima:{since:'septiembre 2026',m:[['Toyota Supra MK4','1:18 · Solido'],['Nissan Silvia S15','1:18 · Solido'],['Honda NSX','1:18 · Solido']]},
 turbo_pe:{since:'octubre 2026',m:[['Toyota Celica GT-Four','1:18 · Solido'],['Subaru Impreza 22B','1:18 · Solido']]},
 pitlane_pe:{since:'septiembre 2026',m:[['Mercedes W15','1:18 · F1'],['Aston Martin AMR26','1:18 · F1']]},
 escala118:{since:'agosto 2026',m:[['Toyota Land Cruiser','1:18 · Solido'],['BMW M3 E36','1:18 · Solido'],['Ford Mustang','1:18 · Solido']]},
 kaizen_cars:{since:'octubre 2026',m:[['Nissan Skyline R34','1:18 · Solido'],['Toyota AE86','1:18 · Solido']]},
 pole_position:{since:'septiembre 2026',m:[['Ferrari SF-25','1:18 · F1'],['Mercedes W16','1:18 · F1']]}
};
var n=new URLSearchParams(location.search).get('u'),c=C[n];
if(!c){document.getElementById('perfil').hidden=true;document.getElementById('nf').hidden=false}
else{
  document.title='@'+n+' · Carros Escala Perú';
  document.getElementById('av').textContent=n.charAt(0).toUpperCase();
  document.getElementById('nick').textContent='@'+n;
  document.getElementById('since').textContent='En la comunidad desde '+c.since;
  document.getElementById('mods').innerHTML=c.m.map(function(x){return '<li><span>'+x[0]+'</span><span>'+x[1]+'</span></li>'}).join('');
  document.getElementById('share').addEventListener('click',function(){
    var b=this,u=location.href;
    if(navigator.share){navigator.share({title:'@'+n,url:u}).catch(function(){})}
    else if(navigator.clipboard){navigator.clipboard.writeText(u).then(function(){b.textContent='Enlace copiado';setTimeout(function(){b.textContent='Compartir perfil'},2000)})}
  });
}
</script>
</body>
</html>
